<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MaidBot Dev Console</title>
<!-- 换用极其稳定的 cdnjs 源 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
:root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --primary: #10b981; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;color:var(--primary);display:flex;align-items:center;gap:8px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-top{padding:16px;border-bottom:1px solid var(--border)}
.panel-title{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:bold}
.input-group{display:flex;gap:6px;margin-bottom:8px}
.input-group input{flex:1;background:#0f172a;border:1px solid var(--border);padding:6px 10px;border-radius:6px;color:white;font-size:12px;outline:none}
.input-group button{background:var(--primary);color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}

.sidebar-scroll{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color 0.3s;}
.sidebar-scroll:hover{scrollbar-color:#475569 transparent;}
.sidebar-scroll::-webkit-scrollbar{width:6px;}
.sidebar-scroll::-webkit-scrollbar-track{background:transparent;}
.sidebar-scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:3px;}
.sidebar-scroll:hover::-webkit-scrollbar-thumb{background:#475569;}

.group-box{margin-bottom:12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.group-header{background:#1e293b;padding:8px 12px;font-size:13px;font-weight:bold;color:#e2e8f0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.group-header:hover{background:#334155;}
.group-header-left{display:flex;align-items:center;gap:8px;}
.group-icon{font-size:10px;transition:transform 0.2s;display:inline-block;}
.group-box.collapsed .group-icon{transform:rotate(-90deg);}
.group-box.collapsed .group-content{display:none;}
.group-header .actions{opacity:0.5;cursor:pointer;padding:4px;}
.group-header .actions:hover{opacity:1;color:#ef4444;background:#334155;border-radius:4px;}
.project-item{padding:8px 12px 8px 28px;font-size:13px;cursor:pointer;border-bottom:1px solid #1e293b;color:#cbd5e1;display:flex;justify-content:space-between;align-items:center;}
.project-item:hover{background:#334155;}
.project-item.active{background:#064e3b;color:#10b981;border-left:3px solid var(--primary);font-weight:bold;}
.project-item.completed{opacity:0.6;color:#64748b;}
.status-badge{font-size:11px;padding:2px 6px;border-radius:4px;background:#334155;color:#94a3b8;}
.status-badge.locked{background:#10b981;color:#0f172a;}
.drag-over{border:2px dashed var(--primary)!important;background:rgba(16,185,129,0.1)!important;}

.sidebar-bottom{padding:16px;border-top:1px solid var(--border);background:#0f172a;font-size:12px;color:#94a3b8;line-height:1.8;}
.sidebar-bottom b{color:#e2e8f0;}

.chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.blackboard-info{background:#1e293b;padding:8px 20px;font-size:12px;color:#94a3b8;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:85%}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
.msg-content{padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.6;word-break:break-word;}
.msg.user .msg-content{background:#3b82f6;color:white;border-bottom-right-radius:2px;white-space:pre-wrap;}
.msg.ai .msg-content{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:2px;}
.msg.ai .msg-content p { margin-bottom: 8px; }
.msg.ai .msg-content pre { background: #282c34; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; position: relative;}
.msg.ai .msg-content code { font-family: ui-monospace,Consolas,monospace; font-size: 13px; }
.msg.ai .msg-content p code { background: #334155; padding: 2px 4px; border-radius: 4px; color: #10b981;}

.msg-meta{font-size:11px;color:#64748b;padding:0 4px}
.input-area{padding:12px 20px;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.quick-cmd-bar { display: flex; gap: 8px; }
.quick-cmd { background: #334155; color: #cbd5e1; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s;}
.quick-cmd:hover { background: #475569; color: white; }
.input-row { display: flex; gap: 12px; }
input.chat-input{flex:1;background:#0f172a;border:1px solid var(--border);padding:12px 16px;border-radius:8px;color:white;outline:none;font-family:inherit}
input.chat-input:focus{border-color:var(--primary)}
button.send-btn{background:var(--primary);color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:bold}
button.done-btn{background:#f59e0b;color:#0f172a;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:bold}
button:disabled{opacity:0.5;cursor:not-allowed}

.copy-btn { position: absolute; top: 6px; right: 6px; background: #4b5563; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: 0.2s;}
pre:hover .copy-btn { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🛠️ MaidBot Dev Console</h1>
  <div style="font-size:12px;color:#94a3b8">联邦架构 · 专属开发通道</div>
</header>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="panel-title">新建项目空间</div>
      <div class="input-group">
        <input type="text" id="new-group" placeholder="组名" style="width: 40%;">
        <input type="text" id="new-project" placeholder="项目名" style="width: 60%;">
      </div>
      <button style="width:100%; padding:8px;" onclick="createProject()">新建并锁定</button>
    </div>
    <div class="sidebar-scroll" id="project-tree">加载中...</div>
    <div class="sidebar-bottom">
      <b>💡 操作手册：</b><br>
      • <b>新建：</b>输入组名和项目名<br>
      • <b>切换：</b>点击项目名称<br>
      • <b>折叠：</b>点击项目组名<br>
      • <b>开发：</b>底部输入框发需求<br>
      • <b>归档：</b>点击“归档蒸馏”
    </div>
  </div>
  <div class="chat-area">
    <div class="blackboard-info" id="blackboard-bar" style="display:none;">
      <span>当前锁定: <b id="current-project-name" style="color:#10b981;"></b></span>
      <span>黑板长度: <b id="code-length">0</b> 字符</span>
      <button onclick="clearHistory()" style="background:#ef4444;color:white;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px;">清空当前对话</button>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
      <div class="quick-cmd-bar">
        <button class="quick-cmd" onclick="showStatus()">📊 状态</button>
        <button class="quick-cmd" onclick="addNote()">📝 记笔记</button>
        <button class="quick-cmd" onclick="archiveProject()">📦 归档蒸馏</button>
      </div>
      <div class="input-row">
        <input class="chat-input" id="input" type="text" placeholder="请先在左侧选择或创建项目组" autocomplete="off" disabled>
        <button class="send-btn" id="send" disabled>发送</button>
      </div>
    </div>
  </div>
</div>
<script src="/dev.js"></script>
</body>
</html>
